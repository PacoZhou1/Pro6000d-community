<svg xmlns="http://www.w3.org/2000/svg" width="640" height="970" viewBox="0 0 640 970" role="img" aria-labelledby="title desc">
<title id="title">社区原始镜像在我们的机器上 → 我们优化后</title>
<desc id="desc">同一套四张RTX6000D。单路生成132到约200tps；8路并发总生成367到648tps；长文本处理8054到9134tps。每项独立刻度，不表示中间过程。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b44}.value{font-size:31px;font-weight:700}.muted{fill:#637387;font-size:19px}.heading{font-size:25px;font-weight:650}</style>
<rect width="640" height="970" rx="20" fill="#f8fafc"/>
<text x="36" y="48" font-size="27" font-weight="700">同一套四张 RTX 6000D</text>
<text x="36" y="80" class="muted">社区原始镜像 → 我们优化后</text>
<text x="36" y="132" class="heading">单路生成速度</text>
<text x="574" y="132" text-anchor="end" class="muted">tps</text>
<line x1="100" y1="300" x2="525" y2="300" stroke="#dce3eb" stroke-width="2"/>
<text x="78" y="306" text-anchor="end" class="muted">0</text>
<line x1="145" y1="234.0" x2="490" y2="200.0" stroke="#168976" stroke-width="4"/>
<circle cx="145" cy="234.0" r="7" fill="#78899b"/>
<circle cx="490" cy="200.0" r="7" fill="#168976"/>
<text x="145" y="215.0" text-anchor="middle" class="value">132</text>
<text x="490" y="181.0" text-anchor="middle" class="value">约 200</text>
<text x="145" y="334" text-anchor="middle" class="muted">社区原始镜像</text>
<text x="490" y="334" text-anchor="middle" class="muted">我们优化后</text>
<text x="36" y="407" class="heading">8 路并发 · 总生成速度</text>
<text x="574" y="407" text-anchor="end" class="muted">tps</text>
<line x1="100" y1="575" x2="525" y2="575" stroke="#dce3eb" stroke-width="2"/>
<text x="78" y="581" text-anchor="end" class="muted">0</text>
<line x1="145" y1="517.7" x2="490" y2="473.7" stroke="#168976" stroke-width="4"/>
<circle cx="145" cy="517.7" r="7" fill="#78899b"/>
<circle cx="490" cy="473.7" r="7" fill="#168976"/>
<text x="145" y="498.7" text-anchor="middle" class="value">367</text>
<text x="490" y="454.7" text-anchor="middle" class="value">648</text>
<text x="145" y="609" text-anchor="middle" class="muted">社区原始镜像</text>
<text x="490" y="609" text-anchor="middle" class="muted">我们优化后</text>
<text x="36" y="682" class="heading">长文本处理速度</text>
<text x="574" y="682" text-anchor="end" class="muted">tps</text>
<line x1="100" y1="850" x2="525" y2="850" stroke="#dce3eb" stroke-width="2"/>
<text x="78" y="856" text-anchor="end" class="muted">0</text>
<line x1="145" y1="758.5" x2="490" y2="746.2" stroke="#168976" stroke-width="4"/>
<circle cx="145" cy="758.5" r="7" fill="#78899b"/>
<circle cx="490" cy="746.2" r="7" fill="#168976"/>
<text x="145" y="739.5" text-anchor="middle" class="value">8,054</text>
<text x="490" y="727.2" text-anchor="middle" class="value">9,134</text>
<text x="145" y="884" text-anchor="middle" class="muted">社区原始镜像</text>
<text x="490" y="884" text-anchor="middle" class="muted">我们优化后</text>
<text x="36" y="951" font-size="17" fill="#637387">单路优化后实测 195–205 tps，图中取约 200。</text></svg>